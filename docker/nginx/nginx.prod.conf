events {
    worker_connections 1024;
}

http {
    include mime.types;
    sendfile on;
    server_tokens off;

    # ---------- Rate limiting ----------
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ---------- Gzip compression ----------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # ==========================================================
    # HTTP (port 80) — ACME challenge + redirect everything else
    # ==========================================================

    # Apex domains → redirect to https://www.<domain>
    server {
        listen 80;
        server_name speakio.fr speakio.eu;

        # Let Certbot validate before redirecting
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # speakio.fr  → https://www.speakio.fr
        # speakio.eu  → https://www.speakio.eu
        location / {
            return 301 https://www.$host$request_uri;
        }
    }

    # www domains → redirect to HTTPS (same host)
    server {
        listen 80;
        server_name www.speakio.fr www.speakio.eu;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================
    # HTTPS (port 443) — Apex redirect
    # ==========================================================
    server {
        listen 443 ssl http2;
        server_name speakio.fr speakio.eu;

        ssl_certificate     /etc/letsencrypt/live/speakio.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/speakio.fr/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # speakio.fr  → https://www.speakio.fr
        # speakio.eu  → https://www.speakio.eu
        return 301 https://www.$host$request_uri;
    }

    # ==========================================================
    # HTTPS (port 443) — Main application
    # ==========================================================
    server {
        listen 443 ssl http2;
        server_name www.speakio.fr www.speakio.eu;

        # ---------- TLS ----------
        ssl_certificate     /etc/letsencrypt/live/speakio.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/speakio.fr/privkey.pem;
        include             /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

        # ---------- Security headers ----------
        add_header X-Content-Type-Options    "nosniff"                                   always;
        add_header X-Frame-Options           "DENY"                                      always;
        add_header X-XSS-Protection          "1; mode=block"                              always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"            always;
        add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"  always;
        add_header Content-Security-Policy    "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://www.speakio.fr https://www.speakio.eu;" always;

        # ---------- Nginx stub_status (restricted to Docker networks) ----------
        location = /nginx_status {
            stub_status on;
            allow 172.16.0.0/12;
            deny all;
        }

        # ---------- NestJS API ----------
        location /api/ {
            proxy_pass http://api:3001;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- Rate-limited auth endpoints ----------
        location /api/auth/ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://api:3001;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- Static uploads (avatars, etc.) ----------
        location /uploads/ {
            proxy_pass http://api:3001;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- Grafana (sub-path handled by GF_SERVER_SERVE_FROM_SUB_PATH) ----------
        location /grafana/ {
            proxy_pass http://grafana:3000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- Umami Analytics (sub-path handled by BASE_PATH) ----------
        location /umami/ {
            proxy_pass http://umami:3000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- Next.js immutable static assets ----------
        location /_next/static/ {
            proxy_pass http://web:3000;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ---------- Next.js frontend (catch-all, must be last) ----------
        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
