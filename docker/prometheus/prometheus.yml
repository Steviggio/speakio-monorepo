global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "speakio-api"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["api:3001"]
        labels:
          service: "api"

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: "nginx"

  - job_name: "mongodb"
    static_configs:
      - targets: ["mongodb-exporter:9216"]
        labels:
          service: "mongodb"
