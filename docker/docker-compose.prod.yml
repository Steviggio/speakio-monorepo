# ══════════════════════════════════════════════════════════════════════
#  Speakio — Production Docker Compose Overlay
#
#  Usage:
#    docker compose -f docker/docker-compose.yml \
#                   -f docker/docker-compose.prod.yml \
#                   --env-file .env.production up -d
#
#  This overlay is merged on top of the base docker-compose.yml.
#  In Docker Compose file merging, list values (like `ports`) are
#  REPLACED (not appended), so setting `ports: []` effectively
#  removes all port bindings declared in the base file.
# ══════════════════════════════════════════════════════════════════════

services:
  # ── MongoDB ────────────────────────────────────────────────────────
  mongo:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: speakio
    ports: []   # Remove host port exposure in production

  # ── API Server ─────────────────────────────────────────────────────
  api:
    ports: []   # Accessed only via nginx reverse-proxy
    env_file:
      - ../.env.production
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Web (Next.js) ─────────────────────────────────────────────────
  web:
    ports: []   # Accessed only via nginx reverse-proxy
    env_file:
      - ../.env.production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx (TLS termination + reverse proxy) ───────────────────────
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Prometheus ─────────────────────────────────────────────────────
  prometheus:
    ports: []   # Accessed only via grafana
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Grafana ────────────────────────────────────────────────────────
  grafana:
    ports: []   # Accessed via nginx sub-path /grafana/
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://www.speakio.fr/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx Exporter ────────────────────────────────────────────────
  nginx-exporter:
    read_only: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── MongoDB Exporter ──────────────────────────────────────────────
  mongodb-exporter:
    environment:
      - MONGODB_URI=mongodb://${MONGODB_ROOT_USER}:${MONGODB_ROOT_PASSWORD}@mongo:27017/speakio?authSource=admin
    command:
      - "--mongodb.uri=mongodb://${MONGODB_ROOT_USER}:${MONGODB_ROOT_PASSWORD}@mongo:27017/speakio?authSource=admin"
      - "--collect-all"
      - "--compatible-mode"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Umami DB (PostgreSQL) ─────────────────────────────────────────
  umami-db:
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Umami (Analytics) ─────────────────────────────────────────────
  umami:
    ports: []   # Accessed via nginx sub-path /umami
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_POSTGRES_PASSWORD}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      BASE_PATH: /umami
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Certbot (SSL certificate management) ──────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: speakio-certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx

# ── Named Volumes ──────────────────────────────────────────────────
volumes:
  certbot-conf:
  certbot-www:
