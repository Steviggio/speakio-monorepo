# docker-compose.yml
# Local development environment for Speakio

services:
  # MongoDB database
  mongo:
    image: mongo:7
    container_name: speakio-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: speakio

  # NestJS API
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: speakio-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/speakio}
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3001}
    env_file:
      - ../.env
    depends_on:
      - mongo

  # Next.js Frontend
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: speakio-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api:3001}
    env_file:
      - ../.env
    depends_on:
      - api

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: speakio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  mongo-data:
