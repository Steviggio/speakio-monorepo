
services:

  # ══════════════════════════════════════════════════════
  #  CORE APPLICATION
  # ══════════════════════════════════════════════════════

  mongo:
    image: mongo:7
    container_name: speakio-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: speakio
    command: ["mongod", "--wiredTigerCacheSizeGB", "1.5"]
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: speakio-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/speakio}
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3001}
    env_file:
      - ../.env
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend
      - frontend

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: speakio-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://api:3001}
      - NEXT_PUBLIC_UMAMI_URL=${NEXT_PUBLIC_UMAMI_URL:-}
      - NEXT_PUBLIC_UMAMI_WEBSITE_ID=${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
    env_file:
      - ../.env
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    depends_on:
      - api
    networks:
      - frontend

  nginx:
    image: nginx:alpine
    container_name: speakio-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    depends_on:
      - api
      - web
    networks:
      - frontend
      - monitoring
      - analytics

  # ══════════════════════════════════════════════════════
  #  OBSERVABILITY
  # ══════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: speakio-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=5GB"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    depends_on:
      - api
    networks:
      - monitoring
      - backend

  grafana:
    image: grafana/grafana:11.0.0
    container_name: speakio-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=***REMOVED***
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    depends_on:
      - prometheus
    networks:
      - monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1
    container_name: speakio-nginx-exporter
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:80/nginx_status"
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 8M
    depends_on:
      - nginx
    networks:
      - monitoring
      - frontend

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: speakio-mongodb-exporter
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongo:27017/speakio
    command:
      - "--mongodb.uri=mongodb://mongo:27017/speakio"
      - "--collect-all"
      - "--compatible-mode"
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - monitoring
      - backend

  # ══════════════════════════════════════════════════════
  #  ANALYTICS (réseau isolé)
  # ══════════════════════════════════════════════════════

  umami-db:
    image: postgres:15-alpine
    container_name: speakio-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ***REMOVED***
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - analytics
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: speakio-umami
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      DATABASE_URL: postgresql://umami:***REMOVED***@umami-db:5432/umami
      APP_SECRET: ***REMOVED***
      BASE_PATH: /umami
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - analytics

  # ══════════════════════════════════════════════════════
  #  LINGUISTIC AGENT (Go + pgvector + vLLM)
  # ══════════════════════════════════════════════════════

  agent-db:
    image: pgvector/pgvector:pg17
    container_name: speakio-agent-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: speakio_agent
      POSTGRES_USER: speakio
      POSTGRES_PASSWORD: ***REMOVED***
    volumes:
      - agent-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakio -d speakio_agent"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent-redis:
    image: redis:7-alpine
    container_name: speakio-agent-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    networks:
      - agent
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  agent-api:
    build:
      context: ../apps/agent
      dockerfile: deploy/Dockerfile.api
    container_name: speakio-agent-api
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgres://speakio:***REMOVED***@agent-db:5432/speakio_agent?sslmode=disable
      - REDIS_URL=redis://agent-redis:6379
      - VLLM_BASE_URL=http://host.docker.internal:11434
      - VLLM_MODEL=${VLLM_MODEL:-qwen3.5:0.8b}
      - EMBEDDING_URL=http://host.docker.internal:11434
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      - JWT_SECRET=${JWT_SECRET:-speakio_super_secret_dev_key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LLM_TIMEOUT=180s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      agent-db:
        condition: service_healthy
      agent-redis:
        condition: service_healthy
    networks:
      - agent
      - frontend

  agent-worker:
    build:
      context: ../apps/agent
      dockerfile: deploy/Dockerfile.worker
    container_name: speakio-agent-worker
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgres://speakio:***REMOVED***@agent-db:5432/speakio_agent?sslmode=disable
      - REDIS_URL=redis://agent-redis:6379
      - EMBEDDING_URL=http://host.docker.internal:11434
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      - JWT_SECRET=${JWT_SECRET:-speakio_super_secret_dev_key}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LLM_TIMEOUT=180s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      agent-db:
        condition: service_healthy
      agent-redis:
        condition: service_healthy
    networks:
      - agent

  # vLLM requires NVIDIA GPU. Uncomment deploy.resources for GPU allocation.
  # For development without GPU, disable this service and mock the LLM endpoint.
  vllm:
    image: vllm/vllm-openai:latest
    container_name: speakio-vllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen3-8B}
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen3-8B}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - agent
    profiles:
      - gpu

# ══════════════════════════════════════════════════════
#  NETWORKS (isolation par couche)
# ══════════════════════════════════════════════════════

networks:
  frontend:
    driver: bridge
    name: speakio-frontend
  backend:
    driver: bridge
    name: speakio-backend
  monitoring:
    driver: bridge
    name: speakio-monitoring
  analytics:
    driver: bridge
    name: speakio-analytics
  agent:
    driver: bridge
    name: speakio-agent

# ══════════════════════════════════════════════════════
#  VOLUMES
# ══════════════════════════════════════════════════════

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:
  umami-db-data:
  agent-db-data:
