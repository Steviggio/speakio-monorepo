name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}/api
  WEB_IMAGE: ghcr.io/${{ github.repository }}/web

jobs:
  # ═══════════════════════════════════════════════════
  #  LINT, BUILD & TEST
  # ═══════════════════════════════════════════════════
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Security audit
      run: npm audit --audit-level=high || true

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Test
      run: npm run test --if-present

  # ═══════════════════════════════════════════════════
  #  BUILD & PUSH DOCKER IMAGES TO GHCR
  # ═══════════════════════════════════════════════════
  docker-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push API image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/api/Dockerfile
        push: true
        tags: |
          ${{ env.API_IMAGE }}:${{ github.sha }}
          ${{ env.API_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Web image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/web/Dockerfile
        push: true
        tags: |
          ${{ env.WEB_IMAGE }}:${{ github.sha }}
          ${{ env.WEB_IMAGE }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ═══════════════════════════════════════════════════
  #  DEPLOY TO HETZNER VPS
  # ═══════════════════════════════════════════════════
  deploy:
    needs: docker-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd ~/speakio-monorepo/docker
          
          # Pull latest images
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
          
          # Deploy with zero-downtime restart
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --env-file ../.env.production \
            up -d --remove-orphans
          
          # Cleanup old images
          docker image prune -f
          
          echo "✅ Deployment complete"
